<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef3fb" />
  <title>AIチャット — 韓国旅行案内</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a href="/" class="nav-back">← ホームに戻る</a>
      <div class="brand">
        <span class="brand-badge">🇰🇷 Korea · 韓流</span>
        <h1>AIチャット</h1>
        <p class="tagline">韓国旅行の質問はこちら。日本語で気軽に相談できます。</p>
      </div>
      <label class="field">
        <span>応答言語</span>
        <select id="replyLanguage" aria-label="応答言語" title="日本語: 回答は日本語のみ。韓国語: 回答は韓国語で表示します。">
          <option value="日本語" selected>日本語（既定）</option>
          <option value="한국어">韓国語</option>
        </select>
      </label>
      <p id="healthStatus" class="muted small">API: …</p>
      <button type="button" id="btnReset" class="btn secondary">会話をリセット</button>
    </aside>
    <main class="main">
      <header class="main-header">
        <h2>チャット</h2>
        <p class="muted small">観光・交通・グルメ・マナーなど、お気軽にどうぞ。</p>
      </header>
      <div id="suggestions" class="suggestions">
        <p class="suggestions-label">例えばこんな質問</p>
        <div class="suggestions-chips">
          <button class="suggestion-chip" data-msg="明洞でショッピングとグルメのおすすめコースは？">明洞 ショッピング&グルメ</button>
          <button class="suggestion-chip" data-msg="仁川空港からソウル市内への移動方法を教えて">空港→市内アクセス</button>
          <button class="suggestion-chip" data-msg="ソウル観光3泊4日のおすすめ日程を作って">ソウル 3泊4日プラン</button>
          <button class="suggestion-chip" data-msg="韓国でT-moneyカードはどこで買えますか？">T-moneyカード</button>
          <button class="suggestion-chip" data-msg="弘大周辺でおすすめのグルメを教えて">弘大グルメ</button>
          <button class="suggestion-chip" data-msg="韓国はビザなしで入国できますか？">ビザ案内</button>
        </div>
      </div>
      <div id="chatLog" class="chat-log" aria-live="polite"></div>
      <form id="chatForm" class="composer">
        <textarea
          id="messageInput"
          rows="2"
          maxlength="8000"
          placeholder="例：ソウルで初めての観光、おすすめコースは？"
          required
          aria-label="メッセージ"
        ></textarea>
        <button type="submit" class="btn primary" id="btnSend">送信</button>
      </form>
    </main>
  </div>
  <script src="/link-preview.js"></script>
  <script src="/maps-open-url.js"></script>
  <script src="/app.js"></script>
</body>
</html>
