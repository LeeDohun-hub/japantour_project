<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0f18" />
  <title>韓国旅行案内 — ホーム</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="page-home">
  <header class="top-nav">
    <span class="top-nav-brand">🛫 Japan Tour</span>
    <a href="/chat/" class="btn btn-sm primary">AIチャット</a>
  </header>
  <main class="home-main">
    <div class="jt-hero home-hero">
      <span class="jt-badge">Korea · Japan Guide</span>
      <h1>韓国旅行案内</h1>
      <p class="home-lead">
        日本人観光客向けの韓国旅行サポート。AIチャットで観光・交通・グルメ・マナーを<br />
        日本語・한국어で質問できます。
      </p>
      <div class="home-actions">
        <a href="/chat/" class="btn primary home-cta">💬 AIチャットを始める</a>
      </div>
    </div>
    <div class="home-grid">
      <div class="jt-home-card">
        <h3>AIチャット</h3>
        <p>ソウル・釜山などエリア、空港アクセス、季節の服装までガイドがお手伝いします。</p>
      </div>
      <div class="jt-home-card">
        <h3>日・韓対応</h3>
        <p>応答言語を選べます。日本語モードでは回答の下に韓国語訳を表示します。</p>
      </div>
      <div class="jt-home-card">
        <h3>API</h3>
        <p>このデモは Django + OpenAI で動作します。`.env` に <code>OPENAI_API_KEY</code> を設定してください。</p>
      </div>
    </div>
  </main>
</body>
</html>
